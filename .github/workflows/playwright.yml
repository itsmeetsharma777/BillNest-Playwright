name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.BILLNEST_BASE_URL }}
          CI: true
      - name: Full test suite
        run: npm test
        env:
          BASE_URL: ${{ secrets.BILLNEST_BASE_URL }}
          API_URL: ${{ secrets.BILLNEST_API_URL }}
          SHOPKEEPER_EMAIL: ${{ secrets.BILLNEST_SHOPKEEPER_EMAIL }}
          SHOPKEEPER_PASSWORD: ${{ secrets.BILLNEST_SHOPKEEPER_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.BILLNEST_CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.BILLNEST_CUSTOMER_PASSWORD }}
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
