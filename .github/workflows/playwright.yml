name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke tests (Chromium)
        run: npm run test:smoke -- --project=chromium
        env:
          BASE_URL: ${{ secrets.BILLNEST_BASE_URL || 'https://bill-nest-production.vercel.app' }}
          CI: true
      - name: Full test suite (Chromium)
        run: npm run test:chromium
        env:
          BASE_URL: ${{ secrets.BILLNEST_BASE_URL || 'https://bill-nest-production.vercel.app' }}
          API_URL: ${{ secrets.BILLNEST_API_URL }}
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
