name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Typecheck
        run: npm run typecheck
      - name: Smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: ${{ secrets.BILLNEST_BASE_URL || 'https://bill-nest-six.vercel.app' }}
          CI: true
      - name: Full test suite
        run: npm test
        env:
          BASE_URL: ${{ secrets.BILLNEST_BASE_URL || 'https://bill-nest-six.vercel.app' }}
          API_URL: ${{ secrets.BILLNEST_API_URL }}
          SHOPKEEPER_EMAIL: ${{ secrets.BILLNEST_SHOPKEEPER_EMAIL }}
          SHOPKEEPER_PASSWORD: ${{ secrets.BILLNEST_SHOPKEEPER_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.BILLNEST_CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.BILLNEST_CUSTOMER_PASSWORD }}
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
